<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — {% endif %}BebasTech</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    <meta name="theme-color" content="#FAF6EF">

    <!-- Open Graph -->
    <meta property="og:site_name" content="BebasTech">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}BebasTech">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}{{ page.image | default: '/assets/img/hero.jpg' }}">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { utama: '#FAF6EF', aksen: '#1E5B44', teks: '#1B1712', paper: '#FAF6EF', ink: '#1B1712', pine: '#1E5B44', clay: '#8A6D4B', sand: '#EFE7D8' },
                    fontFamily: {
                        display: ['Fraunces', 'Georgia', 'serif'],
                        serif: ['Newsreader', 'Georgia', 'serif'],
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background-color: #FAF6EF; color: #1B1712; }
        ::selection { background: #1E5B44; color: #FAF6EF; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #FAF6EF; }
        ::-webkit-scrollbar-thumb { background: #d8cdb8; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #1E5B44; }
        .prose-bebas { font-family: 'Newsreader', Georgia, serif; font-size: 1.17rem; line-height: 1.82; color: #2b251d; }
        .prose-bebas p { margin-bottom: 1.4rem; }
        .prose-bebas h2, .prose-bebas h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; color: #1B1712; line-height: 1.28; margin: 2.4rem 0 1rem; }
        .prose-bebas h2 { font-size: 1.65rem; }
        .prose-bebas h3 { font-size: 1.32rem; }
        .prose-bebas a { color: #1E5B44; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
        .prose-bebas a:hover { text-decoration-thickness: 2px; }
        .prose-bebas strong { color: #1B1712; }
        .prose-bebas blockquote { border-left: 2px solid #1E5B44; padding: 0.2rem 0 0.2rem 1.25rem; margin: 1.8rem 0; font-style: italic; color: #4a4237; }
        .prose-bebas blockquote p { margin: 0.5rem 0; }
        .prose-bebas ul, .prose-bebas ol { margin: 0 0 1.4rem 1.3rem; }
        .prose-bebas li { margin-bottom: 0.5rem; }
        .prose-bebas img { border-radius: 0.5rem; border: 1px solid rgba(27,23,18,0.12); }
        .prose-bebas hr { border: none; border-top: 1px solid rgba(27,23,18,0.15); margin: 2.5rem 0; }
        .btn-pine { display: inline-block; background: #1E5B44; color: #FAF6EF; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.9rem 2rem; border-radius: 9999px; transition: all .2s ease; }
        .btn-pine:hover { background: #163F30; transform: translateY(-1px); }
        .kicker { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #1E5B44; }
        .dropdown-menu { opacity: 0; visibility: hidden; transform: translateY(8px); transition: all .25s ease; }
        .group\/nav:hover .dropdown-menu, .group\/nav:focus-within .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <!-- ===== Navigasi ===== -->
    <header class="sticky top-0 z-50 bg-paper/90 backdrop-blur border-b border-ink/10">
        <nav class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
            <a href="/" class="font-display text-2xl font-semibold tracking-tight" aria-label="BebasTech - Beranda">BebasTech<span class="text-pine">.</span></a>

            <!-- Menu desktop -->
            <div class="hidden md:flex items-center gap-6 text-sm">
                <a href="/#tulisan" class="text-ink/70 hover:text-pine transition">Tulisan</a>
                <a href="/about" class="text-ink/70 hover:text-pine transition">Tentang</a>
                <a href="/kontak" class="text-ink/70 hover:text-pine transition">Kontak</a>
                <span class="text-ink/25">|</span>
                <span class="text-xs font-bold text-pine">ID</span>
                <a href="/en/" class="text-xs text-ink/50 hover:text-pine transition">EN</a>
            </div>

            <!-- Tombol hamburger (mobile) -->
            <button id="menu-btn" class="md:hidden text-ink/70 hover:text-pine p-2" aria-label="Buka menu" aria-expanded="false">
                <svg id="icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                <svg id="icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </nav>

        <!-- Menu mobile -->
        <div id="mobile-menu" class="md:hidden hidden border-t border-ink/10 px-6 py-4 space-y-1 bg-paper">
            <a href="/#tulisan" class="block py-2.5 text-sm font-medium text-ink/75 hover:text-pine transition">Tulisan</a>
            <a href="/about" class="block py-2.5 text-sm font-medium text-ink/75 hover:text-pine transition">Tentang</a>
            <a href="/kontak" class="block py-2.5 text-sm font-medium text-ink/75 hover:text-pine transition">Kontak</a>
            <div class="flex items-center gap-2 pt-3">
                <span class="text-xs font-bold text-pine">ID</span>
                <span class="text-ink/25">|</span>
                <a href="/en/" class="text-xs text-ink/50 hover:text-pine transition">EN</a>
            </div>
        </div>
    </header>

    <!-- ===== Konten ===== -->
    <main class="flex-grow w-full">
        {{ content }}
    </main>

    <!-- ===== Footer ===== -->
    <footer class="border-t border-ink/10 mt-20">
        <div class="max-w-5xl mx-auto px-6 py-12">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-8">
                <div>
                    <div class="font-display text-2xl font-semibold tracking-tight">BebasTech<span class="text-pine">.</span></div>
                    <p class="text-sm text-ink/55 mt-2 max-w-sm">Opini teknologi independen — ditulis manusia, tanpa filter.</p>
                </div>
                <div class="flex items-center gap-6">
                    <a href="https://www.instagram.com/kurniawan_iwan_/" target="_blank" rel="noopener" class="text-ink/45 hover:text-pine transition" aria-label="Instagram">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    </a>
                    <a href="https://www.linkedin.com/in/kurniawan1314" target="_blank" rel="noopener" class="text-ink/45 hover:text-pine transition" aria-label="LinkedIn">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM7.119 20.452H3.554V9h3.565v11.452z"/></svg>
                    </a>
                    <a href="https://github.com/kuredarmy" target="_blank" rel="noopener" class="text-ink/45 hover:text-pine transition" aria-label="GitHub">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                    </a>
                </div>
            </div>
            <div class="border-t border-ink/10 mt-10 pt-6 flex flex-col md:flex-row items-center justify-between gap-3">
                <p class="text-xs text-ink/45">© <span id="year">2026</span> Kurniawan · BebasTech</p>
                <div class="flex items-center gap-5 text-xs text-ink/45">
                    <a href="/about" class="hover:text-pine transition">Tentang</a>
                    <a href="/kontak" class="hover:text-pine transition">Kontak</a>
                    <a href="/en/" class="hover:text-pine transition">English</a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Tahun otomatis di footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Menu mobile
        (function () {
            var btn = document.getElementById('menu-btn');
            var menu = document.getElementById('mobile-menu');
            var iconOpen = document.getElementById('icon-open');
            var iconClose = document.getElementById('icon-close');
            if (!btn || !menu) return;
            btn.addEventListener('click', function () {
                var open = menu.classList.toggle('hidden');
                iconOpen.classList.toggle('hidden', !open);
                iconClose.classList.toggle('hidden', open);
                btn.setAttribute('aria-expanded', String(!open));
            });
            menu.querySelectorAll('a').forEach(function (a) {
                a.addEventListener('click', function () {
                    menu.classList.add('hidden');
                    iconOpen.classList.remove('hidden');
                    iconClose.classList.add('hidden');
                });
            });
        })();

        // Tombol salin tautan (dipakai di halaman artikel)
        function copyLink(btn) {
            var done = function () {
                var label = btn.querySelector('[data-label]');
                if (label) {
                    var original = label.textContent;
                    label.textContent = 'Tersalin!';
                    setTimeout(function () { label.textContent = original; }, 1800);
                }
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(window.location.href).then(done).catch(done);
            } else { done(); }
        }
    </script>
</body>
</html>
