<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — {% endif %}BebasTech</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    <meta name="theme-color" content="#022c22">

    <!-- Open Graph / Twitter -->
    <meta property="og:site_name" content="BebasTech">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}BebasTech">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}{{ page.image | default: '/assets/img/hero.jpg' }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@kuredarmy">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} — {% endif %}BebasTech">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ site.url }}{{ page.image | default: '/assets/img/hero.jpg' }}">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { utama: '#022c22', aksen: '#10b981', teks: '#f8fafc' },
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background-color: #022c22; color: #f8fafc; }
        .glass-panel { background: rgba(255,255,255,0.02); border: 1px solid rgba(16,185,129,0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .glass-panel:hover { border-color: rgba(16,185,129,0.45); }
        ::selection { background: #10b981; color: #022c22; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #022c22; }
        ::-webkit-scrollbar-thumb { background: #065f46; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #10b981; }
        .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
        .reveal.revealed { opacity: 1; transform: none; }
        @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }
        .hero-glow { box-shadow: 0 0 60px rgba(16,185,129,0.25), 0 25px 60px rgba(0,0,0,0.5); }
        .card-thumb img { transition: transform .6s ease; }
        .card-thumb:hover img { transform: scale(1.05); }
        .prose-bebas blockquote { border-left: 3px solid #10b981; background: rgba(16,185,129,0.06); padding: 1rem 1.5rem; border-radius: 0 1rem 1rem 0; font-style: italic; color: #d1fae5; }
        .prose-bebas blockquote p { margin: 0.5rem 0; }
        .prose-bebas p { margin-bottom: 1.25rem; }
        .dropdown-menu { opacity: 0; visibility: hidden; transform: translateY(8px); transition: all .25s ease; }
        .group\/nav:hover .dropdown-menu, .group\/nav:focus-within .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <!-- ===== Navigasi ===== -->
    <header class="sticky top-0 z-50 bg-utama/85 backdrop-blur-md border-b border-aksen/20">
        <nav class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
            <a href="/" class="flex items-center gap-3 shrink-0" aria-label="BebasTech - Beranda">
                <img src="/logo.png" alt="Logo BebasTech" class="w-9 h-9 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                <span class="text-xl font-extrabold tracking-tighter text-white">BEBASTECH<span class="text-aksen">.</span></span>
            </a>

            <!-- Menu desktop -->
            <div class="hidden md:flex items-center gap-7">
                <a href="/" class="text-sm font-medium text-gray-300 hover:text-white transition">Beranda</a>
                <a href="/#artikel-terbaru" class="text-sm font-medium text-gray-300 hover:text-white transition">Artikel</a>
                <div class="relative group/nav">
                    <button class="text-sm font-medium text-gray-300 hover:text-white transition flex items-center gap-1 cursor-pointer" aria-haspopup="true">
                        Tentang
                        <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div class="dropdown-menu absolute right-0 mt-3 w-52 bg-utama border border-aksen/20 rounded-2xl shadow-2xl overflow-hidden">
                        <a href="/about" class="block px-5 py-3 text-sm text-gray-300 hover:text-utama hover:bg-aksen transition">Profil Penulis</a>
                        <a href="/kontak" class="block px-5 py-3 text-sm text-gray-300 hover:text-utama hover:bg-aksen transition">Hubungi Kami</a>
                    </div>
                </div>
                <div class="flex items-center gap-1 border-l border-gray-700 pl-5">
                    <span class="text-xs font-bold text-aksen bg-aksen/10 px-2.5 py-1 rounded-md">ID</span>
                    <a href="/en/" class="text-xs font-medium text-gray-400 hover:text-white transition px-2.5 py-1">EN</a>
                </div>
            </div>

            <!-- Tombol hamburger (mobile) -->
            <button id="menu-btn" class="md:hidden text-gray-300 hover:text-white p-2" aria-label="Buka menu" aria-expanded="false">
                <svg id="icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                <svg id="icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </nav>

        <!-- Menu mobile -->
        <div id="mobile-menu" class="md:hidden hidden border-t border-aksen/20 px-6 py-4 space-y-1 bg-utama/95">
            <a href="/" class="block py-2.5 text-sm font-medium text-gray-200 hover:text-aksen transition">Beranda</a>
            <a href="/#artikel-terbaru" class="block py-2.5 text-sm font-medium text-gray-200 hover:text-aksen transition">Artikel</a>
            <a href="/about" class="block py-2.5 text-sm font-medium text-gray-200 hover:text-aksen transition">Profil Penulis</a>
            <a href="/kontak" class="block py-2.5 text-sm font-medium text-gray-200 hover:text-aksen transition">Hubungi Kami</a>
            <div class="flex items-center gap-2 pt-3">
                <span class="text-xs font-bold text-aksen bg-aksen/10 px-3 py-1.5 rounded-md">ID</span>
                <a href="/en/" class="text-xs font-medium text-gray-400 hover:text-white transition px-3 py-1.5">EN</a>
            </div>
        </div>
    </header>

    <!-- ===== Konten ===== -->
    <main class="flex-grow w-full">
        {{ content }}
    </main>

    <!-- ===== Footer ===== -->
    <footer class="border-t border-aksen/20 bg-black/25 mt-20">
        <div class="max-w-5xl mx-auto px-6 py-12">
            <div class="flex flex-col md:flex-row items-center justify-between gap-8">
                <a href="/" class="flex items-center gap-3">
                    <img src="/logo.png" alt="Logo BebasTech" class="w-10 h-10 rounded-xl">
                    <div>
                        <div class="text-lg font-extrabold tracking-tighter text-white">BEBASTECH<span class="text-aksen">.</span></div>
                        <div class="text-xs text-gray-500">Ruang opini teknologi independen</div>
                    </div>
                </a>
                <div class="flex items-center gap-7">
                    <a href="https://x.com/kuredarmy" target="_blank" rel="noopener" class="text-gray-400 hover:text-aksen transition" aria-label="X / Twitter">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    </a>
                    <a href="https://www.linkedin.com/in/kurniawan1314" target="_blank" rel="noopener" class="text-gray-400 hover:text-aksen transition" aria-label="LinkedIn">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM7.119 20.452H3.554V9h3.565v11.452z"/></svg>
                    </a>
                    <a href="https://github.com/bebastech" target="_blank" rel="noopener" class="text-gray-400 hover:text-aksen transition" aria-label="GitHub">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                    </a>
                </div>
            </div>
            <div class="border-t border-aksen/10 mt-10 pt-6 flex flex-col md:flex-row items-center justify-between gap-3">
                <p class="text-xs text-gray-500 font-medium tracking-wide">© <span id="year">2026</span> BebasTech. Dibangun dengan kebebasan beropini.</p>
                <div class="flex items-center gap-5 text-xs text-gray-500">
                    <a href="/about" class="hover:text-aksen transition">Tentang</a>
                    <a href="/kontak" class="hover:text-aksen transition">Kontak</a>
                    <a href="/en/" class="hover:text-aksen transition">English</a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Tahun otomatis di footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Menu mobile
        (function () {
            var btn = document.getElementById('menu-btn');
            var menu = document.getElementById('mobile-menu');
            var iconOpen = document.getElementById('icon-open');
            var iconClose = document.getElementById('icon-close');
            if (!btn || !menu) return;
            btn.addEventListener('click', function () {
                var open = menu.classList.toggle('hidden');
                iconOpen.classList.toggle('hidden', !open);
                iconClose.classList.toggle('hidden', open);
                btn.setAttribute('aria-expanded', String(!open));
            });
            menu.querySelectorAll('a').forEach(function (a) {
                a.addEventListener('click', function () {
                    menu.classList.add('hidden');
                    iconOpen.classList.remove('hidden');
                    iconClose.classList.add('hidden');
                });
            });
        })();

        // Animasi fade-in saat scroll
        (function () {
            var els = document.querySelectorAll('.reveal');
            if (!('IntersectionObserver' in window) || !els.length) {
                els.forEach(function (el) { el.classList.add('revealed'); });
                return;
            }
            var io = new IntersectionObserver(function (entries) {
                entries.forEach(function (e) {
                    if (e.isIntersecting) { e.target.classList.add('revealed'); io.unobserve(e.target); }
                });
            }, { threshold: 0.08 });
            els.forEach(function (el) { io.observe(el); });
        })();

        // Tombol salin tautan (dipakai di halaman artikel)
        function copyLink(btn) {
            var done = function () {
                var label = btn.querySelector('[data-label]');
                if (label) {
                    var original = label.textContent;
                    label.textContent = 'Tersalin!';
                    setTimeout(function () { label.textContent = original; }, 1800);
                }
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(window.location.href).then(done).catch(done);
            } else { done(); }
        }
    </script>
</body>
</html>
